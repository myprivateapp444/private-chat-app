<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Private Chat</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: #0b0f14;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .app {
      width: 100%;
      max-width: 430px;
      min-height: 100vh;
      background: #111820;
      padding: 25px;
      display: flex;
      flex-direction: column;
    }

    .chat {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding-top: 20px;
    }

    .chat-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 18px;
      border-bottom: 1px solid #303b48;
    }

    .chat-header h2 {
      font-size: 21px;
    }

    .lock {
      color: #5eead4;
      font-size: 14px;
    }

    .messages {
      flex: 1;
      padding: 25px 0;
      overflow-y: auto;
    }

    .message {
      background: #1d2732;
      padding: 12px 15px;
      border-radius: 12px;
      margin-bottom: 12px;
      max-width: 80%;
      word-wrap: break-word;
    }

    .message.me {
      margin-left: auto;
      background: #2563eb;
    }

    .name {
      font-size: 12px;
      color: #aeb9c5;
      margin-bottom: 5px;
    }

    .message.me .name {
      color: #dbeafe;
    }

    .send-area {
      display: flex;
      gap: 8px;
      padding-top: 15px;
      border-top: 1px solid #303b48;
    }

    .send-area input {
      flex: 1;
      padding: 16px;
      border-radius: 12px;
      border: 1px solid #303b48;
      background: #0b0f14;
      color: white;
      font-size: 17px;
      outline: none;
    }

    .send-area button {
      width: 80px;
      padding: 16px;
      border: none;
      border-radius: 12px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .status {
      text-align: center;
      padding: 15px;
      color: #8f9ba8;
    }

    .error {
      text-align: center;
      color: #ff6b6b;
      padding: 20px;
      font-size: 15px;
    }
  </style>
</head>

<body>

  <div class="app">

    <div class="chat" id="chatScreen">

      <div class="chat-header">

        <h2>💬 Private Group</h2>

        <span class="lock">
          🔒 Private
        </span>

      </div>

      <div class="status" id="status">
        Connecting...
      </div>

      <div class="messages" id="messages">

        <div class="message">

          <div class="name">
            System
          </div>

          Welcome to your private chat.

        </div>

      </div>

      <div class="send-area">

        <input
          type="text"
          id="messageInput"
          placeholder="Type a message..."
          onkeydown="handleEnter(event)"
        >

        <button onclick="sendMessage()">
          Send
        </button>

      </div>

    </div>

  </div>


  <!-- FIREBASE -->

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>


  <!-- FIREBASE SETUP -->

  <script>

    const firebaseConfig = {
      apiKey: "AIzaSyCjt2Dbn9QCUVazu-sxYAUt_aNJFJ62GMQ",
      authDomain: "private-chat-app-2a7e3.firebaseapp.com",
      projectId: "private-chat-app-2a7e3",
      storageBucket: "private-chat-app-2a7e3.firebasestorage.app",
      messagingSenderId: "871441421629",
      appId: "1:871441421629:web:ed2aabb24cc528dbfca154"
    };


    firebase.initializeApp(firebaseConfig);


    const auth = firebase.auth();

    const db = firebase.firestore();


    // START FIREBASE LOGIN

    startApp();


    async function startApp() {

      const status =
        document.getElementById("status");

      try {

        status.textContent =
          "Connecting to private chat...";


        // Anonymous Firebase login

        await auth.signInAnonymously();


        status.textContent =
          "Connected";


        console.log(
          "Firebase login successful"
        );


      } catch (err) {

        console.error(
          "Firebase error:",
          err
        );


        status.innerHTML =
          "Firebase error: " +
          err.code;

      }

    }


    // SEND MESSAGE

    function sendMessage() {

      const input =
        document.getElementById("messageInput");


      const text =
        input.value.trim();


      if (text === "") {
        return;
      }


      const message =
        document.createElement("div");


      message.className =
        "message me";


      message.innerHTML = `
        <div class="name">You</div>
        ${escapeHTML(text)}
      `;


      document
        .getElementById("messages")
        .appendChild(message);


      input.value = "";


      const messages =
        document.getElementById("messages");


      messages.scrollTop =
        messages.scrollHeight;

    }


    // ENTER TO SEND

    function handleEnter(event) {

      if (event.key === "Enter") {

        sendMessage();

      }

    }


    // SECURITY

    function escapeHTML(text) {

      const div =
        document.createElement("div");


      div.textContent =
        text;


      return div.innerHTML;

    }

  </script>

</body>
</html>
